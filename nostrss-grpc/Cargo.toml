[package]
name = "nostrss_grpc"
version = "1.1.0"
edition = "2021"
build = "src/build.rs"

[dependencies]
prost = "0.14"
tokio = { version = "1.43.1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14.5", features = ["transport"] }
tonic-prost = "0.14.5"
protoc = "2.28.0"
serde = "1.0.217"
[build-dependencies]
tonic-prost-build = "0.14.5"
