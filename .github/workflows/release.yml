name: Release
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt -- --check
        run: cargo fmt --all -- --check

  test:
    name: Test
    needs: [style]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # build: [stable, beta, nightly]
        build: [stable, beta]
        include:
          - build: beta
            rust: beta
          # - build: nightly
          #   rust: nightly
          #   benches: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust || 'stable' }}

      - name: Install ssl, musl & protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev musl-tools protobuf-compiler

      - name: Build debug
        run: cargo build ${{ matrix.features }}

      - name: Test
        env:
          RUST_TEST_THREADS: 1
        run: cargo test ${{ matrix.features }}

      - name: Test all benches
        if: matrix.benches
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --benches ${{ matrix.features }}

  deploy:
    name: deploy
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
          - i686-unknown-linux-musl
          - arm-unknown-linux-gnueabi
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-unknown-netbsd
          # - aarch64-apple-darwin # CI fails as it appears that we have to use gcc provided by apple.
          # - x86_64-pc-windows-gnu # Currently release fails as compiled will have a .exe extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ssl, musl & protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev musl-tools protobuf-compiler

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build target
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          #strip target/${{ matrix.target }}/release/nostrss
          cd target/${{ matrix.target }}/release
          tar czvf ../../../nostrss-${{ matrix.target }}.tar.gz nostrss nostrss-cli
          cd -

      - name: Publish
        uses: softprops/action-gh-release@v2
        # TODO: if any of the build step fails, the release should be deleted.
        with:
          files: 'nostrss*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
